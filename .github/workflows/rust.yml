name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "lua/**/*.lua"
      - "plugin/**/*.lua"
      - "tests/**/*.lua"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "lua/**/*.lua"
      - "plugin/**/*.lua"
      - "tests/**/*.lua"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check clippy (Lua 5.1)
        run: cargo clippy --locked --all-targets --no-default-features --features lua51 -- -D warnings

  msrv:
    name: Rust 1.97
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Check minimum supported Rust version (LuaJIT)
        run: cargo check --locked

      - name: Check minimum supported Rust version (Lua 5.1)
        run: cargo check --locked --no-default-features --features lua51

  test:
    name: Test (${{ matrix.os }})
    needs: [check, msrv]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Neovim 0.9.5 (Ubuntu)
        if: runner.os == 'Linux'
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.9.5

      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim

      - name: Show Neovim version
        if: runner.os != 'Windows'
        run: nvim --version

      - name: Run tests
        run: cargo test --locked

      - name: Run tests (Lua 5.1)
        run: cargo test --locked --no-default-features --features lua51

      - name: Build native plugin
        run: cargo build --locked --release

      - name: Run Neovim integration tests
        if: runner.os != 'Windows'
        run: nvim --headless -u NONE -l tests/integration.lua
