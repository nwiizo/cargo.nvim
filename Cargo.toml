[package]
name = "cargo-nvim"
version = "0.1.7"
edition = "2024"
rust-version = "1.97"
authors = ["nwiizo <nwiizo@gmail.com>"]
description = "A Neovim plugin for Rust Cargo commands"
license = "MIT"
repository = "https://github.com/nwiizo/cargo.nvim"
keywords = ["neovim", "rust", "cargo", "plugin"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[lib]
name = "cargo_nvim"
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.12", features = ["module"], default-features = false }
process-wrap = { version = "9.1", features = ["tokio1"], default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync"], default-features = false }

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "9.1", features = ["process-group"], default-features = false }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1", features = ["job-object"], default-features = false }

[features]
default = ["luajit"]
lua51 = ["mlua/lua51"]
luajit = ["mlua/luajit"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
